<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login form</title>
    <link rel="stylesheet" href="form.css">
    <link rel="shortcut icon" href="/image/FRESHMAN OF THE YEARS.png" type="image/x-icon">
</head>
<body>
    <div class="gene">
        <form action="">
            <h1>Login</h1>
            <div class="input-box">
                <input type="text" placeholder="Username" required>
            </div>

            <div class="input-box">
                <input type="password" placeholder="Password" required>
            </div>

            <div class="remember-forgot">
                <label for="hh"><input type="checkbox" id="hh">Remember me</label>
                <a href="for.html">Forgot password ?</a>
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="register-link">
                <p>Don't have an account <a href="reg.html">Register</a></p>
            </div>
        </form>
    </div>
</body>
</html>
